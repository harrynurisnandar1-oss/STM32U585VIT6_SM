name: "Laporan Bug / Kerentanan Keamanan / Pelanggaran Protokol"
description: Laporkan kegagalan pengujian, memory leak, exception TrustZone (SecureFault), atau anomali frame DLMS.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gunakan template ini untuk melaporkan bug fungsional, anomali decoding HDLC/APDU, atau insiden keamanan TrustZone.

  - type: dropdown
    id: severity
    attributes:
      label: Tingkat Keparahan (Severity Level)
      options:
        - "Critical / Security Vulnerability (SecureFault, Key Leak, Replay Bypass)"
        - "High (DLMS Association Failed, Silent Drop, Crash / HardFault)"
        - "Medium (Data calculation error, Scaler unit mismatch, Timeout)"
        - "Low (Log format, typo, minor discrepancy)"
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain Terjadinya Masalah
      options:
        - "Secure World (SAU, GTZC, SAES, NSC Gateway, KEK)"
        - "NonSecure World (AMI DLMS Engine, COSEM Model, FreeRTOS Task)"
        - "HDLC Data Link / Framing CRC"
        - "Metrology ADE9000 Interface"
        - "Host Simulator / CTest Suite"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Langkah Reproduksi Masalah
      description: Tuliskan urutan request DLMS, frame hex byte, atau input pemicu bug.
      placeholder: |
        1. Jalankan gurux_simulator.exe
        2. Kirim frame APDU hex: ...
        3. Hasil: Terjadi penolakan atau parsing error...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Perilaku yang Diharapkan vs Perilaku Aktual
      description: Bandingkan respons aktual dengan aturan standar (SPLN / IEC).
    validations:
      required: true

  - type: textarea
    id: test_logs
    attributes:
      label: Log Terminal / Debug Output
      description: Tempelkan cuplikan pesan error dari CTest, debugger GDB, atau GXDLMSDirector.
      render: shell

