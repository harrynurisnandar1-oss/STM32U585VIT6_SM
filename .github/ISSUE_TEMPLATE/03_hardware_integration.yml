name: "Integrasi & Validasi Hardware Fisik (STM32U5 + ADE9000)"
description: Gunakan untuk mencatat tugas yang memerlukan kehadiran fisik board target, kalibrasi SPI, atau probe optik.
title: "[HARDWARE]: "
labels: ["hardware", "board-bringup", "metrology"]
body:
  - type: markdown
    attributes:
      value: |
        Tugas ini khusus untuk aktivitas **Bring-up Hardware**, pengujian peripheral fisik silikon STM32U585,
        komunikasi SPI ADE9000, atau pengujian instrumen lab PLN.

  - type: dropdown
    id: hw_component
    attributes:
      label: Komponen Hardware Target
      options:
        - "Mikrokontroler STM32U585VIT6 (Clock, Power, TrustZone RDP)"
        - "Metering IC ADE9000 (SPI Bus, Register Map, CF Pulses)"
        - "Optical Probe Port / USART DMA fisik"
        - "Latching Relay Actuator (Disconnect Breaker GPIO)"
        - "TAMP Backup Register / VBAT Power Domain"
        - "Option Bytes & Readout Protection (RDP Level 2)"
    validations:
      required: true

  - type: textarea
    id: bench_setup
    attributes:
      label: Kebutuhan Instrumen & Alat Uji
      description: Rincian alat bantu (misal: ST-LINK V3, USB-UART Converter, Sumber Tegangan Uji, Multimeter).
      placeholder: "Contoh: ST-LINK V3, Sumber 3-Phase 230V / 5A, Kabel Probe Optik IEC 62056-21..."
    validations:
      required: true

  - type: textarea
    id: test_procedure
    attributes:
      label: Prosedur Pengujian Hardware
      description: Langkah-langkah pengujian langsung di perangkat fisik.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Kriteria Keberhasilan (Acceptance Criteria)
      value: |
        - [ ] Flashing binary Secure & NonSecure berhasil via ST-LINK
        - [ ] Komunikasi register fisik SPI stabil tanpa korupsi bit
        - [ ] Handshake DLMS via Optical Probe fisik berjalan mulus
        - [ ] Konsumsi daya dan temperatur operasi dalam batas wajar
    validations:
      required: true

