name: "Fitur / Permintaan Protokol DLMS & Standar PLN"
description: Ajukan penambahan atau perubahan fitur protokol DLMS/COSEM, profil OBIS, atau kepatuhan standar PLN.
title: "[FITUR]: "
labels: ["enhancement", "dlms-cosem", "pln-standard"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih telah mengajukan item pekerjaan untuk firmware Smart Meter AMI 3-Phase STM32U585 + ADE9000.
        Gunakan form ini untuk merinci kebutuhan protokol dan pemetaan data model COSEM.

  - type: dropdown
    id: pln_standard
    attributes:
      label: Acuan Standar PLN / Standar Internasional
      description: Pilih standar utama yang mengatur kebutuhan fitur ini.
      options:
        - "SPLN D3.006:2021 (Spesifikasi Meter Listrik Cerdas Terpusat)"
        - "SPLN D5.002:2024 (Keamanan & Kriptografi AMI PLN)"
        - "IEC 62056-46 / 5-3 / 6-1 / 6-2 (DLMS/COSEM Suite)"
        - "NIST SP 800-38D / 800-38F (AES-GCM / Key Wrap)"
        - "Lainnya / Regulasi Internal"
    validations:
      required: true

  - type: dropdown
    id: layer_scope
    attributes:
      label: Lingkup Lapisan (Scope Layer)
      description: Tentukan lapisan arsitektur yang terdampak.
      options:
        - "E2: Protocol & Data Model (DLMS/COSEM, OBIS, APDU, Profile Generic)"
        - "Security: TrustZone Secure World / Cryptographic Acceleration / Key Storage"
        - "E1: Hardware & Metrology (Driver ADE9000, Feeder Snapshot, SPI)"
        - "Communication Port: HDLC, UART DMA, Optical Probe"
    validations:
      required: true

  - type: dropdown
    id: hardware_dependency
    attributes:
      label: Ketergantungan Hardware (Hardware Dependency)
      description: Apakah pekerjaan ini membutuhkan board fisik target?
      options:
        - "Bisa Dikerjakan Tanpa Hardware (Pure Software / Host Simulation / CTest)"
        - "Perlu Board Fisik STM32U585 Target (Silikon / Peripheral)"
        - "Perlu Alat Uji Lab / Kalibrator / Meter Bench ADE9000"
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: Deskripsi Kebutuhan & Logika Kerja
      description: Jelaskan rincian objek COSEM (Class ID, OBIS code, Attributes) atau alur perilaku yang diharapkan.
      placeholder: "Contoh: Menambahkan pembacaan profil beban sesaat atau method eksekusi tertentu..."
    validations:
      required: true

  - type: textarea
    id: verification_plan
    attributes:
      label: Rencana Verifikasi
      description: Bagaimana fitur ini akan diverifikasi?
      value: |
        - [ ] Host Native CTest (Ninja unit test)
        - [ ] Gurux DLMSDirector simulation (TCP port 4059)
        - [ ] Automated Docker runner (docker-compose)
        - [ ] Target Firmware Cross-Compilation (0 Error, 0 Warning)
        - [ ] Uji Fisik di Board Target (JTAG / Optical Probe)
    validations:
      required: true

