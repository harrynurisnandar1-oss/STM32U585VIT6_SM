name: STM32U585 FreeRTOS Firmware CI

on:
  push:
    branches: [ "main", "master", ]
  pull_request:
    branches: [ "main", "master", ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm-cortex-m33:
    name: Build Embedded Firmware (Cortex-M33 / FreeRTOS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Build Tools & ARM Toolchain with Standard C Libraries (Newlib)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Verify Arm Toolchain & Libc Installation
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-gcc -print-file-name=include/math.h

      - name: Configure CMake with ARM Toolchain Preset
        run: |
          cmake --preset Debug

      - name: Build Firmware
        run: |
          cmake --build --preset Debug --parallel

      - name: Display Memory Footprint (Size)
        run: |
          arm-none-eabi-size Secure/build/STM32U585VIT6_SM_S.elf || true
          arm-none-eabi-size NonSecure/build/STM32U585VIT6_SM_NS.elf || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stm32u585-freertos-firmware-debug
          path: |
            Secure/build/*.elf
            Secure/build/*.bin
            Secure/build/*.hex
            Secure/build/*.map
            NonSecure/build/*.elf
            NonSecure/build/*.bin
            NonSecure/build/*.hex
            NonSecure/build/*.map
          retention-days: 7
