name: Windows Native CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    name: Build & Test Native Windows (MSVC / Ninja)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Pre-installed Ninja
        run: |
          ninja --version

      - name: Enable MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Host Unit Tests & Tools)
        run: |
          cmake -S tests -B tests/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build Host Tests and Gurux Simulator
        run: |
          cmake --build tests/build --parallel

      - name: Run CTest Suite (16 Test Suites)
        run: |
          ctest --test-dir tests/build --output-on-failure --verbose
